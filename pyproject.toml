[project]
name = "deeparcade"
version = "0.1.0"
description = "Snake arcade game with genuinely trained AI opponents (Q-learning, DQN, MCTS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "matplotlib>=3.6",
    "plotly>=5.15",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
